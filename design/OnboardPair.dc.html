<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bố mẹ – Nhập mã kết nối</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F1E9;color:#1F2A28}
button{font-family:inherit;cursor:pointer}
a{color:#1F6F5C}a:hover{color:#16503F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #F6F1E9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1F2A28">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="OnboardRole.dc.html" aria-label="Quay lại" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #1F2A28; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 30px; font-weight: 700; line-height: 1.2">Nhập mã con gửi</h1>
    <div style="font-size: 18px; color: #5E6663; line-height: 1.4">Mã gồm 6 số, con gửi qua Zalo hoặc tin nhắn.</div>
  </div>

  <div style="display: flex; justify-content: space-between">
    <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
      <div style="width: 50px; height: 64px; border-radius: 14px; background: #FFFFFF; border: {{b.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700">{{b.ch}}</div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 70px; border: none; border-radius: 16px; background: {{k.bg}}; color: #1F2A28; font-size: {{k.size}}; font-weight: 700">{{k.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
    <a href="OnboardPermissions.dc.html" style="height: 72px; border-radius: 20px; background: #1F6F5C; color: #FFFFFF; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Kết nối với con</a>
  </sc-if>
  <sc-if value="{{incomplete}}" hint-placeholder-val="{{ true }}">
    <div style="height: 72px; border-radius: 20px; background: #E7E0D4; color: #5E6663; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">Còn {{left}} số nữa</div>
  </sc-if>
  <div style="font-size: 16px; color: #5E6663; text-align: center">Không thấy mã? Đưa máy cho con quét mã QR.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { code: '4829' }; }
renderVals() {
  const code = (this.state && this.state.code) || '';
  const set = (v) => this.setState({ code: v });
  const boxes = [0, 1, 2, 3, 4, 5].map((i) => ({
    ch: code[i] || '',
    border: code[i] ? '3px solid #1F6F5C' : (i === code.length ? '3px solid #2B5C9E' : '2px solid #D8D1C4')
  }));
  const digit = (d) => ({ label: d, aria: 'Số ' + d, size: '30px', bg: '#FFFFFF',
    press: () => { if (code.length < 6) set(code + d); } });
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(digit);
  keys.push({ label: 'Xóa hết', aria: 'Xóa hết', size: '17px', bg: '#EFEAE1', press: () => set('') });
  keys.push(digit('0'));
  keys.push({ label: 'Xóa 1 số', aria: 'Xóa số cuối', size: '17px', bg: '#EFEAE1', press: () => set(code.slice(0, -1)) });
  return { boxes: boxes, keys: keys, complete: code.length === 6, incomplete: code.length < 6, left: 6 - code.length };
}
}
</script>
</body>
</html>
