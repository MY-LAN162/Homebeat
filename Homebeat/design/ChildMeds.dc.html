<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Con – Tab Thuốc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F1E9;color:#1F2A28}
button{font-family:inherit;cursor:pointer}
a{color:#1F6F5C}a:hover{color:#16503F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 12px; background: #F6F1E9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1F2A28">
  <h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 26px; font-weight: 700">Thuốc của bố mẹ</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E7E0D4; border-radius: 14px; padding: 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; border: none; border-radius: 11px; background: {{t.bg}}; color: #1F2A28; font-size: 15px; font-weight: {{t.weight}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px">
    <div style="color: #5E6663">Tuần này uống đúng giờ</div>
    <div style="font-weight: 700">{{adherence}}</div>
  </div>

  <sc-for list="{{meds}}" as="m" hint-placeholder-count="3">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; gap: 12px; border: 2px solid {{m.border}}">
      <div style="width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; background-color: #EFEAE1; background-image: repeating-linear-gradient(45deg, #E4DCCD 0, #E4DCCD 6px, #EFEAE1 6px, #EFEAE1 12px); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #5E6663; text-align: center; line-height: 1.2">Ảnh viên thuốc</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div style="font-size: 16px; font-weight: 700">{{m.name}}</div>
        <div style="font-size: 13px; color: #5E6663">{{m.dose}}</div>
        <div style="display: flex; gap: 4px; flex-wrap: wrap">
          <sc-for list="{{m.times}}" as="tm" hint-placeholder-count="2">
            <div style="padding: 3px 8px; border-radius: 8px; background: #DCEBE4; color: #16503F; font-size: 12px; font-weight: 600">{{tm}}</div>
          </sc-for>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: {{m.stockColor}}">{{m.stock}}</div>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; gap: 8px">
    <a href="ScanRx.dc.html" style="flex-grow: 1; height: 48px; border-radius: 14px; background: #1F6F5C; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      Quét đơn thuốc
    </a>
    <button style="flex-grow: 1; height: 48px; border: 2px solid #1F2A28; border-radius: 14px; background: #FFFFFF; color: #1F2A28; font-size: 15px; font-weight: 600">Nhập tay</button>
  </div>

  <div style="flex-grow: 1"></div>

  <nav aria-label="Điều hướng chính" style="margin: 0 -16px; height: 72px; background: #FFFFFF; border-top: 1px solid #E7E0D4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="ChildHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6663; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"></path></svg>
      Trang chủ
    </a>
    <a href="ChildMeds.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1F6F5C; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>
      Thuốc
    </a>
    <a href="ChildVisits.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6663; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      Đi khám
    </a>
    <a href="ChildFamily.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6663; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Gia đình
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { who: 'bo' }; }
renderVals() {
  const who = (this.state && this.state.who) || 'bo';
  const low = (n) => n <= 5;
  const med = (name, dose, times, days) => ({
    name: name, dose: dose, times: times,
    stock: low(days) ? 'Còn ' + days + ' ngày · nên mua thêm' : 'Còn ' + days + ' ngày',
    stockColor: low(days) ? '#7A3606' : '#5E6663',
    border: low(days) ? '#E0925A' : '#FFFFFF'
  });
  const data = {
    bo: { meds: [
      med('Amlodipine 5mg', 'Huyết áp · 1 viên, sau ăn', ['Sáng 7:00'], 4),
      med('Metformin 500mg', 'Tiểu đường · 1 viên, sau ăn', ['Sáng 7:00', 'Trưa 12:00', 'Tối 19:00'], 26),
      med('Aspirin 81mg', '1 viên, sau ăn', ['Trưa 12:00'], 30)
    ], adherence: '19/21 lần' },
    me: { meds: [
      med('[Thuốc tim mạch]', '1 viên, sau ăn sáng', ['Sáng 7:30'], 12),
      med('[Thuốc mỡ máu]', '1 viên, buổi tối', ['Tối 20:00'], 3)
    ], adherence: '11/14 lần' }
  };
  const tab = (id, label) => ({ label: label, on: who === id ? 'true' : 'false',
    bg: who === id ? '#FFFFFF' : 'transparent', weight: who === id ? '700' : '500',
    pick: () => this.setState({ who: id }) });
  return { tabs: [tab('bo', 'Bố Hùng'), tab('me', 'Mẹ Thu')], meds: data[who].meds, adherence: data[who].adherence };
}
}
</script>
</body>
</html>
