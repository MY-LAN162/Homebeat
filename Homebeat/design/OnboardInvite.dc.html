<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Con – Thêm bố mẹ và xưng hô</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F6F1E9;color:#1F2A28}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:#1F6F5C}a:hover{color:#16503F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 20px; display: flex; flex-direction: column; gap: 12px; background: #F6F1E9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1F2A28">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="OnboardRole.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #1F2A28; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; font-size: 14px; color: #5E6663; font-weight: 600">Bước 2/3</div>
  </div>
  <h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.25">Thêm bố hoặc mẹ</h1>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
      Tên của bố mẹ
      <input type="text" value="Hùng" style="height: 48px; border: 1.5px solid #D8D1C4; border-radius: 12px; padding: 0 14px; font-size: 17px; color: #1F2A28; background: #FFFFFF">
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 14px; font-weight: 600">Bạn gọi là</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{callOpts}}" as="o" hint-placeholder-count="4">
          <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 16px; font-weight: 600">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 14px; font-weight: 600">Bạn xưng là</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{selfOpts}}" as="o" hint-placeholder-count="2">
          <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 16px; font-weight: 600">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="background: #F6F1E9; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.45">
      <div style="font-size: 12px; color: #5E6663; font-weight: 600">App sẽ nói với bố mẹ như thế này</div>
      <div>"{{line1}}"</div>
      <div>Nút điểm danh: <b>"{{line2}}"</b></div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center">
    <div style="font-size: 14px; color: #5E6663; font-weight: 600">Mã kết nối cho máy của bố mẹ</div>
    <div style="font-size: 40px; font-weight: 700; letter-spacing: 6px; color: #1F6F5C">482 913</div>
    <div style="font-size: 13px; color: #5E6663">Hết hạn sau 24 giờ</div>
    <div style="display: flex; gap: 8px; width: 100%">
      <button style="flex-grow: 1; height: 48px; border: none; border-radius: 14px; background: #2B5C9E; color: #FFFFFF; font-size: 15px; font-weight: 600">Gửi mã qua Zalo</button>
      <button style="flex-grow: 1; height: 48px; border: 2px solid #1F2A28; border-radius: 14px; background: #FFFFFF; color: #1F2A28; font-size: 15px; font-weight: 600">Hiện mã QR</button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="ChildHome.dc.html" style="height: 56px; border-radius: 18px; background: #1F6F5C; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Xong, vào trang chủ</a>
  <a href="#" style="font-size: 15px; font-weight: 600; text-align: center; padding: 4px">+ Thêm người thứ hai (mẹ, ông, bà)</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { call: 'Bố', self: 'Con' }; }
renderVals() {
  const s = this.state || {};
  const call = s.call || 'Bố';
  const self = s.self || 'Con';
  const opt = (label, cur, key) => {
    const on = label === cur;
    return { label: label, on: on ? 'true' : 'false',
      bg: on ? '#1F6F5C' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F2A28', border: on ? '#1F6F5C' : '#D8D1C4',
      pick: () => this.setState({ [key]: label }) };
  };
  const c = call.toLowerCase();
  return {
    callOpts: ['Bố', 'Mẹ', 'Ông', 'Bà'].map((l) => opt(l, call, 'call')),
    selfOpts: ['Con', 'Cháu'].map((l) => opt(l, self, 'self')),
    line1: 'Đến giờ uống thuốc rồi ' + c + ' ơi',
    line2: self + ' ơi, ' + c + ' ổn'
  };
}
}
</script>
</body>
</html>
